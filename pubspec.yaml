name: hand_detection
description: Hand, gesture and landmark detection using on-device LiteRT (formerly TensorFlow Lite) models
version: 4.3.1

repository: "https://github.com/hugocornellier/hand_detection"
homepage: "https://github.com/hugocornellier/hand_detection"

topics:
  - litert
  - tflite
  - hand-detection
  - computer-vision
  - on-device-ml

environment:
  sdk: ">=3.10.0 <4.0.0"
  # flutter_test in Flutter 3.44 and earlier pins meta 1.18.0, which cannot
  # coexist with dartcv4 2.3.1 (meta ^1.19.0). 3.47.5 is the validated floor.
  flutter: ">=3.47.5"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  opencv_dart: ^2.2.2
  # Direct constraint so resolution can never fall back to a dartcv4 whose iOS
  # CMake hook hardcodes a 12.0 deployment target (rejected by Xcode 27).
  # No Dart source imports it; it is a compatibility floor only.
  dartcv4: ^2.3.1
  # dartcv4 2.3.1's link hook uses the hooks 2.x LinkInput API but still
  # declares hooks >=1.0.0, so a lockfile holding hooks 1.x fails every
  # profile and release build. Same compatibility-floor role as dartcv4.
  hooks: ^2.0.0
  flutter_litert: ^3.9.2
  meta: ^1.19.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/models/hand_detection.tflite
    - assets/models/hand_landmark_full.tflite
    - assets/models/gesture_embedder.tflite
    - assets/models/canned_gesture_classifier.tflite

  plugin:
    platforms:
      ios:
        dartPluginClass: HandDetectionDart
      android:
        dartPluginClass: HandDetectionDart
      macos:
        dartPluginClass: HandDetectionDart
      windows:
        pluginClass: HandDetectionPlugin
      linux:
        pluginClass: HandDetectionPlugin
      web:
        pluginClass: HandDetectionWeb
        fileName: hand_detection_web.dart
